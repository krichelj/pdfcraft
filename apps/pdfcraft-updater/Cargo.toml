[package]
name = "pdfcraft-updater"
description = "PdfCraft Updater: shows each stage of Merge and update and Install and relaunch (the fork's macOS helper app)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "pdfcraft-updater"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true, features = ["default_fonts"] }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
