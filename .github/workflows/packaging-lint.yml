# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax, and the
# macOS packaging scripts and property lists. Fork rule (CLAUDE.md): macOS only, so no Windows,
# Linux desktop/AppStream or Flatpak checks.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: [self-hosted, linux]
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          # own-ci-runners: jobs never sudo; the owner installs host packages, the job checks them.
          for t in shellcheck xmllint; do
            command -v "$t" >/dev/null || { echo "::error::$t missing on the runner: see own-ci-runners"; exit 1; }
          done
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck (macOS packaging)
        run: |
          shellcheck -x packaging/env.sh packaging/icons.sh packaging/macos/*.sh packaging/macos/dmg/*.sh
      - name: Property lists
        run: |
          xmllint --noout packaging/macos/*.plist*
