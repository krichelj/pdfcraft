name: CI

# Once per change, on its PR (main only changes through PRs; the PR's run tests the merge result).
# main itself is tested every night with the fuzz run.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly fuzzing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # A fallback for jobs without the saturate step; see BUILD_JOBS_CAP there.
  CARGO_BUILD_JOBS: 64
  RAYON_NUM_THREADS: 230
  RUST_TEST_THREADS: 230

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fork rule (CLAUDE.md): macOS only. These are the tests of the shared code the Mac app is built
  # from, run on the Linux runners; no web (wasm32), Windows or Linux-packaging checks.
  test:
    name: test (shared code)
    runs-on: [self-hosted, linux]
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # fork-notes needs the history and the release tags.
          fetch-depth: 0

      # Tests and rayon use 90% of the host's hardware threads. Builds stop at BUILD_JOBS_CAP: a clean
      # build of every test binary took 74 s at 64 jobs and the same at 128, 230 and 460 (140 s at
      # 16, 92 s at 32; Sanders, 2026-10-16), because cargo's dependency graph, not the core count,
      # is the limit past 64. The rest of the host stays free for the jobs running beside this one.
      - name: Saturate host threads (saturate-the-bottleneck)
        run: |
          # A build directory that persists on the runner host, one per job, so builds are
          # incremental (a JIT runner's checkout starts empty; rust-cache's upload and download
          # cost more than they saved). Jobs of the same name queue on cargo's lock.
          echo "CARGO_TARGET_DIR=$HOME/.cache/ci-target/pdfcraft-${{ github.job }}" >> "$GITHUB_ENV"
          NPROC=$(nproc)
          JOBS=$(( NPROC * 9 / 10 ))
          BUILD_JOBS_CAP=64
          BUILD_JOBS=$(( JOBS < BUILD_JOBS_CAP ? JOBS : BUILD_JOBS_CAP ))
          echo "Host hardware threads: ${NPROC}; tests use ${JOBS}, builds ${BUILD_JOBS} jobs"
          {
            echo "CARGO_BUILD_JOBS=${BUILD_JOBS}"
            echo "RAYON_NUM_THREADS=${JOBS}"
            echo "RUST_TEST_THREADS=${JOBS}"
            # nextest's own setting: the whole suite took 6.9 s here at 90% of the threads, 7.4 s at
            # 128 and 8.6 s at 64 (2026-10-18), so tests take all of it; builds stay at the cap.
            echo "NEXTEST_TEST_THREADS=${JOBS}"
          } >> "$GITHUB_ENV"

      # The optional craft-fonts build input (Japanese fonts), so the Japanese font tests run on
      # Linux; Windows tests the build without it. See craftrules standards/fonts.md.
      - name: Check out craft-fonts (Linux)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts

      # own-ci-runners: jobs never sudo; the owner installs host packages, the job checks them.
      # qpdf and poppler-utils are the independent oracles (crates/oracle).
      - name: Check Linux system dependencies (egui/winit/rfd) and the oracles
        run: |
          for p in libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev qpdf poppler-utils; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'ok installed' \
              || { echo "::error::$p missing on the runner: see own-ci-runners"; exit 1; }
          done

      # The independent oracles (crates/oracle) are only worth having when they run. With this
      # set, a missing one fails the job instead of printing a skip notice that reads as a pass.
      - name: Require the oracles
        run: echo "PDFCRAFT_ORACLES_REQUIRED=1" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt


      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # nextest runs the ~170 test binaries side by side (one process per test); `cargo test` runs
      # them one after another, which left all but ~5 of the host's cores idle (83 s against 28 s
      # locally). nextest skips doctests, so those run on their own. The host provides
      # cargo-nextest (own-ci-runners); xtask's workflow test keeps this step parallel.
      - name: Test (with craft-fonts)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          cargo nextest --version >/dev/null 2>&1 \
            || { echo "::error::cargo-nextest missing on the runner: see own-ci-runners"; exit 1; }
          cargo nextest run --workspace --no-fail-fast
          cargo test --workspace --doc

      # A version bump to a fork release not released yet needs its record (docs/fork/releases);
      # the Release workflow refuses one without it, so the PR that bumps the version does too.
      - name: Fork release notes
        run: cargo xtask fork-notes pending

      - name: Layering
        if: runner.os == 'Linux'
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        run: cargo xtask assets

      - name: CLI without the MCP server still builds
        run: cargo check -p pdfcraft-cli --no-default-features

  deny:
    name: dependency licences and advisories
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz:
    name: fuzz (mutation, 15 min)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Saturate host threads (saturate-the-bottleneck)
        run: |
          # A build directory that persists on the runner host, one per job, so builds are
          # incremental (a JIT runner's checkout starts empty; rust-cache's upload and download
          # cost more than they saved). Jobs of the same name queue on cargo's lock.
          echo "CARGO_TARGET_DIR=$HOME/.cache/ci-target/pdfcraft-${{ github.job }}" >> "$GITHUB_ENV"
          NPROC=$(nproc)
          JOBS=$(( NPROC * 9 / 10 ))
          # Builds stop at BUILD_JOBS_CAP, as in the test job (no faster past 64 jobs). No
          # RAYON_NUM_THREADS here: the fuzzer runs JOBS children and gives each its own small pool.
          BUILD_JOBS_CAP=64
          BUILD_JOBS=$(( JOBS < BUILD_JOBS_CAP ? JOBS : BUILD_JOBS_CAP ))
          echo "CARGO_BUILD_JOBS=${BUILD_JOBS}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: Fetch the pdf.js corpus (seeds)
        run: cargo xtask corpus
      - name: Fuzz
        run: cargo xtask fuzz --time 900 --seed ${{ github.run_number }}
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: fuzz-out/findings
          if-no-files-found: ignore
