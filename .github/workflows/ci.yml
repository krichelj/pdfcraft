name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # nightly fuzzing

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_JOBS: 230
  RAYON_NUM_THREADS: 230
  RUST_TEST_THREADS: 230

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Linux)
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Saturate host threads (saturate-the-bottleneck)
        run: |
          NPROC=$(nproc)
          JOBS=$(( NPROC * 9 / 10 ))
          echo "Host logical cores: ${NPROC}; saturating to 90%: ${JOBS} threads"
          {
            echo "CARGO_BUILD_JOBS=${JOBS}"
            echo "RAYON_NUM_THREADS=${JOBS}"
            echo "RUST_TEST_THREADS=${JOBS}"
          } >> "$GITHUB_ENV"

      # The optional craft-fonts build input (Japanese fonts), so the Japanese font tests run on
      # Linux; macOS and Windows test the build without it. See craftrules standards/fonts.md.
      - name: Check out craft-fonts (Linux)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storytold/craft-fonts
          ref: abb83316d96aa59c1cf64784289e378fe9fa5695
          path: craft-fonts

      # own-ci-runners: jobs never sudo; the owner installs host packages, the job checks them.
      - name: Check Linux system dependencies (egui/winit/rfd)
        run: |
          for p in libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev; do
            dpkg-query -W -f='${Status}' "$p" 2>/dev/null | grep -q 'ok installed' \
              || { echo "::error::$p missing on $(hostname): see own-ci-runners"; exit 1; }
          done

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (with craft-fonts)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: cargo test --workspace

      - name: Layering
        run: cargo xtask layers

      - name: Assets (licences and attribution)
        run: cargo xtask assets

      - name: CLI without the MCP server still builds
        run: cargo check -p pdfcraft-cli --no-default-features

  wasm:
    name: wasm32 check
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Saturate host threads (saturate-the-bottleneck)
        run: |
          NPROC=$(nproc)
          JOBS=$(( NPROC * 9 / 10 ))
          {
            echo "CARGO_BUILD_JOBS=${JOBS}"
            echo "RAYON_NUM_THREADS=${JOBS}"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
          cache-bin: false
      - name: Check library crates for wasm32
        run: cargo xtask wasm

  deny:
    name: dependency licences and advisories
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz:
    name: fuzz (mutation, 15 min)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Saturate host threads (saturate-the-bottleneck)
        run: |
          NPROC=$(nproc)
          JOBS=$(( NPROC * 9 / 10 ))
          {
            echo "CARGO_BUILD_JOBS=${JOBS}"
            echo "RAYON_NUM_THREADS=${JOBS}"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz
          cache-bin: false
      - name: Fetch the pdf.js corpus (seeds)
        run: cargo xtask corpus
      - name: Fuzz
        run: cargo xtask fuzz --time 900 --seed ${{ github.run_number }}
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: fuzz-out/findings
          if-no-files-found: ignore
