# Each new storytold/pdfcraft release (a vX.Y.Z tag): bring it into the fork through a PR, and merge it once its
# checks pass (packaging/fork/sync-upstream.sh). The on-call LLM resolves the merge's conflicts and
# fixes what fails CI's checks, before and after the PR opens. The merge is a push to main, which
# starts Release: it builds the macOS app and publishes it, with the release record as its notes
# (release.yml).
#
# The script pushes, opens and merges with the owner's gh login on the runner host (own-ci-runners):
# a commit made with this workflow's own token can't change workflow files, which upstream merges
# often do, and its pushes and PRs start no other workflow, so CI and Release would never run.
name: Sync upstream

on:
  schedule:
    # Every 15 minutes: a new upstream release tag (vX.Y.Z) the fork lacks is merged as soon as
    # it appears (packaging/fork/upstream-release.sh), as <its version>-p1. GitHub can't start a
    # fork's workflow from another repository's tag, so the fork polls.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  # Which upstream commit to merge: the newest release tag the fork lacks. Only a run started by hand
  # with no new release merges upstream's main (the owner's choice, 2026-11-08: upstream cuts
  # releases on a branch of their own, so its main conflicts with the fork between releases).
  watch:
    name: watch upstream releases
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      run: ${{ steps.release.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Newest upstream release the fork lacks
        id: release
        env:
          BY_HAND: ${{ github.event_name == 'workflow_dispatch' }}
          # Debugging the sync: the repository variable set to true syncs every new upstream commit
          # on main, not only releases (upstream-release.sh prints `main`). Unset in production.
          SYNC_FOLLOW_MAIN: ${{ vars.SYNC_FOLLOW_MAIN }}
        run: |
          tag=$(packaging/fork/upstream-release.sh)
          if [ "$tag" = main ]; then tag=""; echo "run=true" >> "$GITHUB_OUTPUT"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ] || [ "$BY_HAND" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi

  sync:
    name: sync upstream
    needs: watch
    if: needs.watch.outputs.run == 'true'
    # `primary` (own-ci-runners): the primary runner host takes it at once, the other only when the
    # primary hasn't within the takeover delay, so a host that is down never stalls the sync.
    runs-on: [self-hosted, linux, primary]
    # The LLM's fix loop builds and tests the workspace, then the PR's checks are awaited (and fixed,
    # at most twice).
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The sync pushes with the owner's login, never this workflow's token.
          persist-credentials: false
      - name: Check the owner's gh login
        run: |
          gh auth status 2>&1 | grep -q 'workflow' \
            || { echo "::error::the runner host's gh login lacks the workflow scope: see own-ci-runners"; exit 1; }

      # As in CI's test job: the fix loop runs CI's checks with the host's threads, in a build
      # directory that persists on the runner host.
      - name: Saturate host threads (saturate-the-bottleneck)
        run: |
          echo "CARGO_TARGET_DIR=$HOME/.cache/ci-target/pdfcraft-${{ github.job }}" >> "$GITHUB_ENV"
          NPROC=$(nproc)
          JOBS=$(( NPROC * 9 / 10 ))
          BUILD_JOBS_CAP=64
          BUILD_JOBS=$(( JOBS < BUILD_JOBS_CAP ? JOBS : BUILD_JOBS_CAP ))
          {
            echo "CARGO_BUILD_JOBS=${BUILD_JOBS}"
            echo "RAYON_NUM_THREADS=${JOBS}"
            echo "RUST_TEST_THREADS=${JOBS}"
            echo "NEXTEST_TEST_THREADS=${JOBS}"
          } >> "$GITHUB_ENV"

      # No LLM (the owner, 2026-10-25): a merge goes through when upstream's changes merge cleanly
      # and every check passes; a conflict the sync has no rule for, or a failing check, stops it
      # and opens an issue for the owner.
      - name: Merge without the on-call LLM
        run: echo "SYNC_NO_LLM=1" >> "$GITHUB_ENV"

      - name: Sync storytold/pdfcraft (a new release, else main)
        env:
          SYNC_UPSTREAM_TAG: ${{ needs.watch.outputs.tag }}
        run: packaging/fork/sync-upstream.sh
      # The gate on the fork's version line: main's version must be built on upstream's latest
      # release (<X.Y.Z>-p<N>, X.Y.Z no older). The sync above adds a new release; this proves it.
      # Not while the sync waits on an issue the owner already has (SYNC_WAITING, lib.sh's
      # stop_for_person): main is behind by design then, and the issue is the reminder.
      - name: Fork version is on top of upstream's latest release
        if: env.SYNC_WAITING != '1'
        run: |
          git fetch --quiet origin main
          git checkout --quiet origin/main
          cargo xtask version check-upstream
