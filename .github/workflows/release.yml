# Release pipeline (fork: macOS Apple Silicon only, see CLAUDE.md): a push to main (or `release`)
# whose version has no tag yet builds the app, publishes "PdfCraft v<version>" with its record
# (docs/fork/releases) as the notes, and checks the published DMG. A version already released is
# skipped, so ordinary merges release nothing; Sync upstream bumps the version with every merge.
#
# Only the job that drafts the release runs in the `release` environment, whose deployments are
# restricted to the `release` branch: nothing else can publish, and each draft shows as a
# deployment. The build jobs use no environment (the macOS one reads the repository secret
# MACOS_SDKROOT, a path on the runner host), so a dispatch on another branch builds and checks
# everything (a dry run) and the draft-release job is refused there.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a run mid-notarization or mid-upload; a newer push waits its turn.
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  PDFCRAFT_BUILD_SHA: ${{ github.sha }}
  INPUT_VERSION: ${{ inputs.version }}

jobs:
  version:
    name: version
    runs-on: [self-hosted, linux]
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      skip: ${{ steps.done.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          # fork-notes needs the history and the release tags.
          fetch-depth: 0
      - id: v
        name: Resolve version
        run: |
          . packaging/env.sh
          v="${INPUT_VERSION#v}"
          v="${v:-$VERSION}"
          if ! printf '%s' "$v" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          # The fork's patchlevel (0.8.0-p1, CLAUDE.md) is a full release, not a pre-release:
          # GitHub's releases/latest, which Help > Check for updates asks, skips pre-releases.
          case "$v" in *-p[0-9]*) pre=false ;; *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$v"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
          } >>"$GITHUB_OUTPUT"
          echo "### PdfCraft v$v (\`${GITHUB_SHA::9}\`)" >>"$GITHUB_STEP_SUMMARY"
      # No release without its record (docs/fork/releases/v<version>.md, CLAUDE.md fork rules): this
      # fails, and nothing is built, when the record is missing, its summary is unwritten, or its
      # generated part no longer matches git. Its text becomes the release page.
      # A version that already has its tag was released: nothing to build (most pushes to main).
      - id: done
        name: Released already?
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/v$V" >/dev/null; then
            echo "::notice::v$V is already released; nothing to build"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi
      - name: Release notes (docs/fork/releases)
        if: steps.done.outputs.skip != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: cargo xtask fork-notes body "$V" --commit "$GITHUB_SHA" >"$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@v4
        if: steps.done.outputs.skip != 'true'
        with:
          name: notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  # A push whose version is already released but that changes the fork since that release (a
  # feature merged): open the next patch release's PR (<base>-p<N+1>, its record listing the PRs since)
  # and merge it once green; that merge is the push that builds and publishes it.
  bump:
    name: next patch release
    needs: version
    if: needs.version.outputs.skip == 'true' && github.event_name == 'push'
    runs-on: [self-hosted, linux]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushes with the owner's gh login (packaging/fork/lib.sh), never this workflow's token.
          persist-credentials: false
      - name: Check the owner's gh login
        run: |
          gh auth status 2>&1 | grep -q 'workflow' \
            || { echo "::error::the runner host's gh login lacks the workflow scope: see own-ci-runners"; exit 1; }
      - name: Open and merge the next patch release
        run: packaging/fork/release-bump.sh

  # The fork's runners are Linux only (own-ci-runners), so macOS is cross-built here: zig links it,
  # the macOS SDK comes from the owner's Xcode (/scratch/XXXXX/macos-sdk).
  macos:
    name: macOS aarch64 (Apple Silicon)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: [self-hosted, linux]
    env:
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      MACOS_SDKROOT: ${{ secrets.MACOS_SDKROOT }}
    steps:
      - uses: actions/checkout@v4
      # The craft-fonts build input (Japanese fonts): every release embeds it. Bump deliberately.
      - name: Check out craft-fonts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      # No dtolnay/rust-toolchain or rust-cache here: both write the user's real ~/.cargo, and a
      # concurrent job's rustup reinstall deleted the toolchain under a running build (run
      # 37862986363: CurrentDirUnlinked, then `cargo: command not found`). The hosts carry stable
      # with aarch64-apple-darwin (own-ci-runners); the job only checks it.
      - name: Check the toolchain
        run: |
          rustup target list --installed | grep -qx aarch64-apple-darwin \
            || { echo "::error::aarch64-apple-darwin target missing on $(hostname): see own-ci-runners"; exit 1; }
          cargo --version
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$PDFCRAFT_VERSION"
      - name: Cross-build and ad-hoc sign
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/macos/cross-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    # Fork rule (CLAUDE.md): macOS on Apple Silicon only; other platforms are upstream's.
    needs: [version, macos]
    if: needs.version.outputs.skip != 'true'
    runs-on: [self-hosted, linux]
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: notes
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum -- * | tee SHA256SUMS.txt
      - name: Create or update the draft release
        working-directory: artifacts
        run: |
          tag="v$VERSION"
          title="PdfCraft v$VERSION"
          pre=()
          if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $tag is already published. Bump the version (cargo xtask version set) before pushing to release."
              exit 1
            fi
            echo "Updating draft $tag: replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE" \
              --notes-file "$GITHUB_WORKSPACE/notes/release-notes.md"
            gh release upload "$tag" --clobber -- *
          else
            echo "Creating draft $tag"
            # The page's text is the release's record (the version job's Release notes step).
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" \
              --notes-file "$GITHUB_WORKSPACE/notes/release-notes.md" "${pre[@]}" -- *
          fi
          {
            echo "Release **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
      # Published, not left as a draft: the tag is created here, and releases/latest (Help > Check for
      # updates, install.sh) points at it from now on.
      - name: Publish
        run: gh release edit "v$VERSION" --draft=false --latest
      # The release is only done when the DMG people download from it holds a working app: download
      # it back from the published release and check the image, the app, its arch and signature.
      - name: Check the published DMG
        run: |
          d="$RUNNER_TEMP/published"
          rm -rf "$d" && mkdir -p "$d" && cd "$d"
          gh release download "v$VERSION" -p "pdfcraft-$VERSION-macos-aarch64.dmg" -p SHA256SUMS.txt
          sha256sum -c --ignore-missing SHA256SUMS.txt
          for t in dmg hfsplus rcodesign file; do
            command -v "$t" >/dev/null || { echo "::error::$t missing on the runner: see own-ci-runners"; exit 1; }
          done
          dmg extract "pdfcraft-$VERSION-macos-aarch64.dmg" image.hfs >/dev/null
          hfsplus image.hfs ls / | grep -q ' PdfCraft.app$'
          hfsplus image.hfs ls / | grep -q ' Applications$'
          hfsplus image.hfs extract /PdfCraft.app/Contents/MacOS/PdfCraft PdfCraft >/dev/null
          file PdfCraft | grep -q 'Mach-O 64-bit arm64 executable'
          rcodesign print-signature-info PdfCraft | grep -q code_directory
          hfsplus image.hfs extract /PdfCraft.app/Contents/Info.plist Info.plist >/dev/null
          grep -A1 CFBundleShortVersionString Info.plist | grep -q "<string>$VERSION</string>"
          echo "Published **PdfCraft v$VERSION**: the DMG holds the arm64, signed PdfCraft $VERSION." >>"$GITHUB_STEP_SUMMARY"
